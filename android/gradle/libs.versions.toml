# Guftugu Android version catalog.
#
# Toolchain (AGP 8.13.1 / Gradle 8.14 / compileSdk 36 / Kotlin 2.3.20 / KSP 2.3.12) is pinned in CLAUDE.md.
# Library versions follow docs/ANDROID_MODULES.md EXCEPT where the listed version's AAR metadata
# demands compileSdk 37 + AGP 9.1.0 (compose 1.12.x via BOM 2026.08+, navigation 2.10.x,
# lifecycle 2.11.x, core 1.19.x, okhttp 5.5.x, coil 3.6.x). Those are held at the newest
# release that builds with compileSdk 36. Bump them together with AGP/compileSdk.
[versions]
agp = "8.13.1"
kotlin = "2.3.20"
ksp = "2.3.12"
composeBom = "2026.06.01"   # compose 1.11.4 / material3 1.4.0 (2026.09.00 needs compileSdk 37)
activityCompose = "1.13.0"
navigationCompose = "2.9.8"   # 2.10.x needs compileSdk 37 / AGP 9.1
lifecycle = "2.10.0"          # 2.11.x needs compileSdk 37 / AGP 9.1
coreKtx = "1.18.0"            # 1.19.x needs compileSdk 37 / AGP 9.1
splashscreen = "1.2.0"
biometric = "1.1.0"
fragment = "1.9.0"
room = "2.8.5"
datastore = "1.2.1"
work = "2.11.2"
okhttp = "5.4.0"              # 5.5.x needs compileSdk 37
kotlinxSerialization = "1.11.0"
kotlinxCoroutines = "1.11.0"
coil = "3.5.0"                # 3.6.x needs compileSdk 37
media3 = "1.11.1"
webrtc = "1.3.10"
zxing = "3.5.4"
zxingEmbedded = "4.3.0"
junit = "4.13.2"

[libraries]
# Compose (versions come from the BOM)
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# AndroidX
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-service = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "lifecycle" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }

# Networking / serialization / coroutines
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

# Media / images
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
coil-video = { group = "io.coil-kt.coil3", name = "coil-video", version.ref = "coil" }

# Calls
stream-webrtc-android = { group = "io.getstream", name = "stream-webrtc-android", version.ref = "webrtc" }

# QR
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
zxing-android-embedded = { group = "com.journeyapps", name = "zxing-android-embedded", version.ref = "zxingEmbedded" }

# Tests
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
